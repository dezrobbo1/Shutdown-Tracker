spring:
  datasource:
    url: ${SHUTDOWN_TRACKER_DB_URL:jdbc:postgresql://localhost:5432/shutdown_tracker}
    username: ${SHUTDOWN_TRACKER_DB_USERNAME:shutdown_tracker}
    password: ${SHUTDOWN_TRACKER_DB_PASSWORD:shutdown_tracker_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: ${SHUTDOWN_TRACKER_FLYWAY_LOCATIONS:filesystem:infra/migrations}
    baseline-on-migrate: false

shutdown-tracker:
  persistence:
    enabled: true
  project-parse-worker:
    enabled: ${SHUTDOWN_TRACKER_PROJECT_PARSE_WORKER_ENABLED:true}
  project-export-worker:
    enabled: ${SHUTDOWN_TRACKER_PROJECT_EXPORT_WORKER_ENABLED:true}
  review-project-bootstrap:
    enabled: ${SHUTDOWN_TRACKER_REVIEW_PROJECT_BOOTSTRAP_ENABLED:true}
