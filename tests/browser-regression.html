<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Browser regression</title></head>
<body data-result="running">running
<script type="module">
import {
  buildComparisonRows,
  classifyProjectResultCompatibility,
  parseProjectXml
} from "../src/project-xml.js";
import { EXECUTION_EVENT_TYPES, createExecutionEvent, deriveExecutionState } from "../src/execution.js";
import { generateCandidateText } from "../src/transaction-profiles.js";

try {
  const [sourceXml, projectResultXml] = await Promise.all([
    fetch("./fixtures/assigned-task.xml").then((response) => response.text()),
    fetch("./fixtures/project-authored-result.xml").then((response) => response.text())
  ]);
  const parsed = parseProjectXml(sourceXml);
  const projectResult = parseProjectXml(projectResultXml);

  if (parsed.leafTasks.length !== 2) throw new Error("leaf parsing failed");
  if (parsed.taskByUid.get("43").hierarchyPath !== "Work Package") throw new Error("hierarchy context failed");
  if (parsed.assignmentsByTaskUid.get("43")?.[0]?.timephasedData?.length !== 1) throw new Error("assignment timephased parsing failed");
  if (projectResult.taskByUid.get("43")?.timephasedData?.[0]?.type !== "11") throw new Error("Project-authored task Type 11 parsing failed");

  const sameTime = new Date(2026, 0, 5, 8, 0);
  const sameTimeEvents = [
    createExecutionEvent({ taskUid: "43", type: EXECUTION_EVENT_TYPES.START, timestamp: sameTime, sequence: 1, recordedAt: new Date("2026-01-05T00:00:01Z") }),
    createExecutionEvent({ taskUid: "43", type: EXECUTION_EVENT_TYPES.FINISH, timestamp: sameTime, sequence: 2, recordedAt: new Date("2026-01-05T00:00:02Z") })
  ];
  if (deriveExecutionState(sameTimeEvents, "43") !== "Completed") throw new Error("same-time ordering failed");

  const events = [
    createExecutionEvent({ taskUid: "43", type: EXECUTION_EVENT_TYPES.START, timestamp: new Date(2026, 0, 5, 8, 0), sequence: 1, recordedAt: new Date("2026-01-05T00:00:01Z") }),
    createExecutionEvent({ taskUid: "43", type: EXECUTION_EVENT_TYPES.SKIP_TO_PLANNED_FINISH, timestamp: new Date(2026, 0, 5, 16, 0), sequence: 2, recordedAt: new Date("2026-01-05T00:00:02Z") })
  ];

  const generated = generateCandidateText({
    sourceXml,
    project: parsed,
    events,
    profileId: "assigned-completion-native-v0"
  });
  const candidate = parseProjectXml(generated.candidateText);
  const candidateTask = candidate.taskByUid.get("43");
  const candidateAssignment = candidate.assignmentsByTaskUid.get("43")?.[0];

  if (generated.changedTaskUids.join(",") !== "43") throw new Error("changed task identity failed");
  if (generated.changedAssignmentUids.join(",") !== "91") throw new Error("changed assignment identity failed");
  if (candidateTask?.percentComplete !== "100") throw new Error("candidate task completion failed");
  if (candidateTask?.actualDuration !== "PT8H0M0S" || candidateTask?.remainingDuration !== "PT0H0M0S") throw new Error("candidate task duration closure failed");
  if ((candidateTask?.timephasedData?.length ?? 0) !== 0) throw new Error("candidate must not author task Type 11 timephasing");
  if (candidateAssignment?.uid !== "91" || candidateAssignment?.resourceUid !== "5") throw new Error("candidate source assignment identity failed");
  if (candidateAssignment?.actualWork !== "PT16H0M0S" || candidateAssignment?.remainingWork !== "PT0H0M0S") throw new Error("candidate assignment work closure failed");
  if (candidateAssignment?.timephasedData?.[0]?.type !== "2") throw new Error("candidate assignment Type 2 failed");

  const strict = classifyProjectResultCompatibility({
    candidate,
    result: projectResult,
    touchedTaskUids: ["43"]
  });
  if (strict.classification !== "strict-result") throw new Error("strict result classification failed");
  if (!strict.warnings.some((warning) => warning.includes("Project GUID changed"))) throw new Error("Project GUID warning failed");

  const rows = buildComparisonRows({ source: parsed, candidate, result: projectResult, taskUids: ["43"] });
  const taskTimephased = rows.find((row) => row.key === "43-task-timephased");
  const assignmentRow = rows.find((row) => row.key === "43-assignments");
  const allTimephased = rows.find((row) => row.key === "project-timephased-all");
  if (!taskTimephased || taskTimephased.candidate.includes("11=1") || !taskTimephased.result.includes("11=1")) throw new Error("Project-generated task Type 11 distinction failed");
  if (!assignmentRow?.candidate.includes("Timephased 1 rows") || !assignmentRow.candidate.includes("2=1")) throw new Error("candidate assignment comparison failed");
  if (!allTimephased || allTimephased.source === allTimephased.candidate) throw new Error("candidate global timephased comparison failed");

  const referenceXml = projectResultXml.replace(
    "  </Tasks>",
    "    <Task><UID>45</UID><ID>9</ID><Name>Added reference task</Name><WBS>1.3</WBS><OutlineNumber>1.3</OutlineNumber><OutlineLevel>2</OutlineLevel><Summary>0</Summary></Task>\n  </Tasks>"
  );
  const reference = classifyProjectResultCompatibility({
    candidate,
    result: parseProjectXml(referenceXml),
    touchedTaskUids: ["43"]
  });
  if (reference.classification !== "reference") throw new Error("reference classification failed");

  document.body.dataset.result = "pass";
  document.body.textContent = "pass";
} catch (error) {
  document.body.dataset.result = "fail";
  document.body.textContent = error instanceof Error ? error.stack : String(error);
}
</script>
</body>
</html>
