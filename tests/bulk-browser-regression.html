<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Bulk browser regression</title></head>
<body data-result="running">running
<script type="module">
import {
  analyzePlannedCompletionCut,
  buildBulkCompletionExecutionIntent,
  buildBulkCompletionIntentDocument,
  buildBulkCompletionResultEvidenceDocument,
  buildPartialProgressIntentDocument,
  generateBulkAssignedCompletionNativeV0,
  planMondayFiftyPercentSample
} from "../src/bulk-planned-completion.js";
import { validateBulkCompletionResult } from "../src/bulk-result-validation.js";
import { classifyProjectResultCompatibility, parseProjectXml } from "../src/project-xml.js";

function schedulingStructure(calendar = "calendar-v1") {
  return {
    calendarUid: "1",
    predecessorLinks: ["43|1|1|0|0|7"],
    calendars: [calendar]
  };
}

function removeTouchedTypeEleven(xmlText, taskUid) {
  const document = new DOMParser().parseFromString(xmlText, "application/xml");
  const namespace = document.documentElement.namespaceURI;
  const taskElement = Array.from(document.getElementsByTagNameNS(namespace, "Task")).find((element) =>
    Array.from(element.children).some(
      (child) => child.localName === "UID" && child.textContent?.trim() === String(taskUid)
    )
  );
  if (!taskElement) throw new Error(`task ${taskUid} missing while removing Type 11`);
  for (const child of Array.from(taskElement.children)) {
    if (child.localName === "TimephasedData") child.remove();
  }
  return new XMLSerializer().serializeToString(document);
}

try {
  const [sourceXml, projectResultXml] = await Promise.all([
    fetch("./fixtures/assigned-task.xml").then((response) => response.text()),
    fetch("./fixtures/project-authored-result.xml").then((response) => response.text())
  ]);
  const project = parseProjectXml(sourceXml);
  const analysis = analyzePlannedCompletionCut({
    project,
    cutoff: "2026-01-05T17:00:00"
  });
  if (analysis.plannedFinishedCount !== 2) throw new Error(`expected 2 planned-finished leaves, got ${analysis.plannedFinishedCount}`);
  if (analysis.eligible.length !== 1 || analysis.eligible[0].taskUid !== "43") throw new Error("proven-shape eligibility failed");
  if (analysis.unsupported.length !== 1) throw new Error("unsupported task reporting failed");

  const generated = generateBulkAssignedCompletionNativeV0({ sourceXml, analysis });
  if (generated.changedTaskUids.join(",") !== "43") throw new Error("changed task identity failed");
  if (generated.profile.classification !== "native-evidence-derived") throw new Error("profile provenance missing");
  if (!generated.candidateText.includes("<PercentComplete>100</PercentComplete>")) throw new Error("task completion missing");
  if (!generated.candidateText.includes("<Type>2</Type>")) throw new Error("assignment actual work Type 2 missing");
  if (generated.candidateText.includes("<Type>11</Type>")) throw new Error("browser must not author task Type 11");

  const executionIntent = buildBulkCompletionExecutionIntent({
    analysis,
    recordedAt: new Date("2026-01-01T00:00:00Z")
  });
  if (!Object.isFrozen(executionIntent) || !Object.isFrozen(executionIntent[0])) {
    throw new Error("execution intent was not frozen");
  }

  const candidate = parseProjectXml(generated.candidateText);
  const result = parseProjectXml(projectResultXml);
  candidate.schedulingStructure = schedulingStructure();
  result.schedulingStructure = schedulingStructure();
  const compatibility = classifyProjectResultCompatibility({
    candidate,
    result,
    touchedTaskUids: generated.changedTaskUids
  });
  const validation = validateBulkCompletionResult({
    candidate,
    result,
    transactions: generated.transactions,
    compatibility
  });
  if (!validation.pass) throw new Error(`strict bulk result validation failed: ${validation.failures.join(" ")}`);
  if (validation.typeElevenTaskCount !== 1) throw new Error("Type 11 completion was not validated");
  if (!validation.schedulingStructurePreserved) throw new Error("scheduling structure was not preserved");

  const noTypeEleven = parseProjectXml(removeTouchedTypeEleven(projectResultXml, "43"));
  noTypeEleven.schedulingStructure = schedulingStructure();
  const noTypeElevenValidation = validateBulkCompletionResult({
    candidate,
    result: noTypeEleven,
    transactions: generated.transactions,
    compatibility: classifyProjectResultCompatibility({
      candidate,
      result: noTypeEleven,
      touchedTaskUids: generated.changedTaskUids
    })
  });
  if (noTypeElevenValidation.pass) throw new Error("missing Type 11 received a strict success state");

  const changedStructureResult = parseProjectXml(projectResultXml);
  changedStructureResult.schedulingStructure = schedulingStructure("calendar-changed");
  const changedStructureValidation = validateBulkCompletionResult({
    candidate,
    result: changedStructureResult,
    transactions: generated.transactions,
    compatibility: classifyProjectResultCompatibility({
      candidate,
      result: changedStructureResult,
      touchedTaskUids: generated.changedTaskUids
    })
  });
  if (changedStructureValidation.pass) throw new Error("changed calendar semantics received a strict success state");

  const referenceXml = projectResultXml.replace(
    "  </Tasks>",
    "    <Task><UID>45</UID><ID>9</ID><Name>Added task</Name><WBS>1.3</WBS><OutlineNumber>1.3</OutlineNumber><OutlineLevel>2</OutlineLevel><Summary>0</Summary></Task>\n  </Tasks>"
  );
  const referenceResult = parseProjectXml(referenceXml);
  referenceResult.schedulingStructure = schedulingStructure();
  const referenceCompatibility = classifyProjectResultCompatibility({
    candidate,
    result: referenceResult,
    touchedTaskUids: generated.changedTaskUids
  });
  const referenceValidation = validateBulkCompletionResult({
    candidate,
    result: referenceResult,
    transactions: generated.transactions,
    compatibility: referenceCompatibility
  });
  if (referenceValidation.pass) throw new Error("reference schedule received a strict success state");

  const intent = buildBulkCompletionIntentDocument({
    source: { fileName: "source.xml", sha256: "source" },
    candidate: {
      fileName: "candidate.xml",
      sha256: "candidate",
      changedTaskUids: generated.changedTaskUids,
      executionIntent
    },
    analysis,
    createdAt: new Date("2026-01-01T00:00:00Z")
  });
  if (intent.profile.classification !== "native-evidence-derived") throw new Error("intent profile classification missing");

  const resultEvidence = buildBulkCompletionResultEvidenceDocument({
    source: { fileName: "source.xml", sha256: "source", project: candidate.project },
    candidate: {
      fileName: "candidate.xml",
      sha256: "candidate",
      changedTaskUids: generated.changedTaskUids,
      changedAssignmentUids: generated.changedAssignmentUids,
      project: candidate.project
    },
    analysis,
    result: {
      fileName: "result.xml",
      sha256: "result",
      project: result.project,
      compatibility,
      validation
    },
    createdAt: new Date("2026-01-01T00:00:00Z")
  });
  if (resultEvidence.candidate.executionIntent.length !== 2) throw new Error("result evidence omitted execution intent");
  if (resultEvidence.candidate.executionIntent[0].recordedAtUtc !== "2026-01-01T00:00:00.000Z") {
    throw new Error("result evidence changed execution intent provenance");
  }

  const partial = planMondayFiftyPercentSample({
    project,
    cutoff: "2026-01-05T10:00:00",
    fraction: 0.5
  });
  if (partial.exportable !== false) throw new Error("partial plan must remain non-exportable");
  if (partial.selected.length < 1) throw new Error("partial intent preview produced no sample");
  const partialIntent = buildPartialProgressIntentDocument({
    source: { fileName: "source.xml", sha256: "source" },
    plan: partial,
    createdAt: new Date("2026-01-01T00:00:00Z")
  });
  if (partialIntent.cutoff !== "2026-01-05T10:00:00") throw new Error("partial cutoff provenance failed");

  document.body.dataset.result = "pass";
  document.body.textContent = "pass";
} catch (error) {
  document.body.dataset.result = "fail";
  document.body.textContent = error instanceof Error ? error.stack : String(error);
}
</script>
</body>
</html>
