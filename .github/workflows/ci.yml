name: XML round-trip lab CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Browser regression
        run: |
          node scripts/serve.mjs >/tmp/xml-lab-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          "${{ steps.setup-chrome.outputs.chrome-path }}" \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:4173/tests/browser-regression.html > /tmp/browser-regression.html
          cat /tmp/browser-regression.html
          grep -q 'data-result="pass"' /tmp/browser-regression.html
      - run: npm run build
