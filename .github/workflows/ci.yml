name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-maven-test:
    name: Backend Maven test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven tests
        run: mvn test

  frontend-test-build:
    name: Frontend test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend apps
        run: npm run build

  simulation-harness-test:
    name: Simulation harness test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run simulation harness tests
        run: python -m unittest discover -s scripts/simulation/tests -p "test_*.py"

  migration-validation:
    name: Migration and export-integrity validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate clean install, populated upgrades, and export integrity
        run: bash scripts/db/validate-migrations.sh

      - name: Remove migration-validation containers and volumes
        if: always()
        run: docker compose -f infra/docker/docker-compose.postgres.yml down -v
